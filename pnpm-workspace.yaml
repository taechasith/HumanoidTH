# pnpm 12 reads its settings from this file (the "pnpm" key in package.json is ignored).
# Dependency build scripts must be approved explicitly; unlisted packages fail the
# install with ERR_PNPM_IGNORED_BUILDS. Allow only the ones this project needs.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
